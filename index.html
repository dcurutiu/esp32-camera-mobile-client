<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32 Camera</title>
    <meta name="theme-color" content="#0f1f12">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ESP32 View</h1>

    <div class="status">
        <span id="dot" class="dot"></span>
        <span id="statusText">connecting...</span>
        <button type="button" id="reloadBtn" class="icon-btn" aria-label="Check board status"><img src="reload.png" alt=""></button>
    </div>

    <div id="buttonsRow" class="buttons">
        <button id="acquireBtn">Acquire image</button>
        <button id="calibrateBtn">Calibrate camera</button>
    </div>

    <div id="progress" class="progress hidden">
        <div id="progressFill" class="progress-fill"></div>
        <span id="progressText" class="progress-text">Working...</span>
    </div>

    <img id="photo" alt="Latest image">
    <div class="image-info">
        <span id="photoDate">--</span>
        <button type="button" id="refreshImgBtn" class="icon-btn" aria-label="Refresh image"><img src="reload.png" alt=""></button>
    </div>
    <div class="links">
        <a id="downloadLink" class="download" href="#"> Download full resolution</a>
        <br>
        <a class="download" href="config.html">Open Settings</a>
    </div>

    <div id="errorBox" class="error hidden">
        <div class="face">&#128542;</div>
        <p id="errorText"></p>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
    <script src="config.js?v=9"></script>
    <script src="app.js?v=9"></script>
    <script src="pwa.js"></script>
</body>
</html>
